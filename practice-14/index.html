<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Цвет темы браузера -->
  <meta name="theme-color" content="#4285f4">
  <!-- iOS: иконка на домашний экран -->
  <link rel="apple-touch-icon" href="/icons/favicon-128x128.png">
  <!-- iOS: стиль статус-бара -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- iOS: заголовок приложения -->
  <meta name="apple-mobile-web-app-title" content="Заметки">

  <title>Заметки — Практика 14</title>
  <link rel="stylesheet" href="https://unpkg.com/chota@latest">
  <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
  <style>
    body { max-width: 700px; margin: 0 auto; padding: 1rem; }
    #notes-list li { background: #f5f5f5; margin-bottom: 0.5rem; padding: 0.6rem 1rem; border-radius: 4px; }
    #offline-banner { display: none; background: #e74c3c; color: #fff; text-align: center; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="offline-banner">Вы офлайн — данные загружены из кэша</div>
  <h1>Заметки</h1>
  <form id="note-form" class="row">
    <input class="col-9" type="text" id="note-input" placeholder="Введите заметку" required>
    <button class="col-3 button primary" type="submit">Добавить</button>
  </form>
  <ul id="notes-list" style="list-style:none; padding:0; margin-top:1rem;"></ul>
  <script src="app.js"></script>
</body>
</html>
