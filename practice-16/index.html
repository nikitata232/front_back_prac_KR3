<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4285f4">
  <link rel="apple-touch-icon" href="/icons/favicon-128x128.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заметки">

  <title>Заметки — Практика 16</title>
  <link rel="stylesheet" href="https://unpkg.com/chota@latest">
  <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
  <style>
    body { max-width: 700px; margin: 0 auto; padding: 0; }
    header { background: #4285f4; color: #fff; padding: 1rem; }
    header h1 { margin: 0 0 0.5rem 0; font-size: 1.4rem; }
    .tab { border: none; background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; padding: 0.5rem 1rem; font-size: 1rem; border-bottom: 3px solid transparent; }
    .tab.active { color: #fff; border-bottom-color: #fff; }
    #app-content { padding: 1rem; }
    #offline-banner { display: none; background: #e74c3c; color: #fff; text-align: center; padding: 0.4rem; font-size: 0.9rem; }
    footer { text-align: center; padding: 1rem; border-top: 1px solid #eee; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="offline-banner">Вы офлайн — приложение работает из кэша</div>

  <header>
    <h1>Заметки</h1>
    <nav>
      <button id="home-btn" class="tab active">Главная</button>
      <button id="about-btn" class="tab">О приложении</button>
    </nav>
  </header>

  <main id="app-content"></main>

  <footer>
    <button id="enable-push" class="button success">Включить уведомления</button>
    <button id="disable-push" class="button error" style="display:none;">Отключить уведомления</button>
  </footer>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
